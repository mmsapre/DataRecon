# party / pg-pg-same-schema
# PostgreSQL public.party_landing -> PostgreSQL public.party_master (same schema, different tables)
mms:
  recon:
    domains:
      party:
        profiles:
          pg-pg-same-schema:
            datasources:
              source: landing
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              schema: public
              table: party_landing
              fields: [party_name, country_code, status]
            target:
              schema: public
              table: party_master
              fields: [party_name, country_code, status]
