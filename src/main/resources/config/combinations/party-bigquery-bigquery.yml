# party / bigquery-bigquery
# BigQuery source table -> BigQuery target table (same named datasource, different tables)
mms:
  recon:
    domains:
      party:
        profiles:
          bigquery-bigquery:
            datasources:
              source: bq
              target: bq
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              table: party_landing
              fields: [party_name, country_code, status]
            target:
              table: party
              fields: [party_name, country_code, status]
