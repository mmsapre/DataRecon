# party / pg-csv
# PostgreSQL landing.party -> CSV files via Calcite (path + regex pattern)
mms:
  recon:
    domains:
      party:
        profiles:
          pg-csv:
            datasources:
              source: landing
              target: csv
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              table: party
              fields: [party_name, country_code, status]
