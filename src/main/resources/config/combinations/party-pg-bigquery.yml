# party / pg-bigquery
# PostgreSQL landing.party -> BigQuery bq.party (Calcite)
mms:
  recon:
    domains:
      party:
        profiles:
          pg-bigquery:
            datasources:
              source: landing
              target: bq
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              table: party
              fields: [party_name, country_code, status]
