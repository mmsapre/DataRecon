spring:
  application:
    name: data-recon
  profiles:
    # Pass only the profile: dev | uat | sit | prod
    # --spring.profiles.active=uat  OR  SPRING_PROFILES_ACTIVE=uat  OR  PROFILE=uat
    default: ${PROFILE:dev}
  main:
    web-application-type: reactive
  # App store is JDBC; named Postgres source/target pools are built manually (not spring.r2dbc.*).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    create-schemas: true
    default-schema: ${mms.recon.database.schema:public}
    schemas:
      - ${mms.recon.database.schema:public}
    placeholders:
      runTable: ${mms.recon.database.tables.run:rec_run}
      recordTable: ${mms.recon.database.tables.record:rec_record}
      datasourceTable: ${mms.recon.database.tables.datasource:rec_datasource}
      domainTable: ${mms.recon.database.tables.domain:rec_domain}
      profileTable: ${mms.recon.database.tables.profile:rec_profile}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Shared bootstrap.
# Primary recon store (properties only → ReconJdbcFactory / reconDataSource):
#   mms.recon.database → rec_run / rec_record / catalog tables
# Business datasources (table only → DatasourceCatalog + type registries):
#   loaded from rec_datasource at start; created/updated via POST /api/datasources
mms:
  recon:
    auth:
      username: ${DATA_RECON_USER:admin}
      password: ${DATA_RECON_PASSWORD:admin}

    build:
      version: ${MMS_RECON_VERSION:dev}

    # Actor stamped on created_by / updated_by when the application writes rows.
    actor: ${DATA_RECON_ACTOR:${spring.application.name:data-recon}}

    # App Postgres only — results + catalog. Not Mongo/BigQuery; not source/target DBs.
    database:
      host: ${DATA_RECON_DB_HOST:localhost}
      port: ${DATA_RECON_DB_PORT:5436}
      name: ${DATA_RECON_DB_NAME:data_recon}
      username: ${DATA_RECON_DB_USER:postgres}
      password: ${DATA_RECON_DB_PASSWORD:postgres}
      maximum-pool-size: 5
      schema: ${DATA_RECON_DB_SCHEMA:public}
      tables:
        run: ${DATA_RECON_DB_RUN_TABLE:rec_run}
        record: ${DATA_RECON_DB_RECORD_TABLE:rec_record}
        datasource: ${DATA_RECON_DB_DATASOURCE_TABLE:rec_datasource}
        domain: ${DATA_RECON_DB_DOMAIN_TABLE:rec_domain}
        profile: ${DATA_RECON_DB_PROFILE_TABLE:rec_profile}

    # Optional summaries (not datasources/domains).
    llm:
      url: ${DATA_RECON_LLM_URL:}
      api-key: ${DATA_RECON_LLM_API_KEY:}
      model: ${DATA_RECON_LLM_MODEL:gpt-4o-mini}
      timeout-seconds: 30
      max-records: 50

    defaults:
      batchSize: 1000
      batchConcurrency: 5
      hashingStrategy: TypeLenient
      queryFileBaseDir: queries
      reconMode: MISMATCH_DETAILS
