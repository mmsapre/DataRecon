# Local / developer profile (active by default via spring.profiles.default=dev).
# Activate explicitly: --spring.profiles.active=dev
mms:
  recon:
    postgres:
      datasources:
        landing:
          host: ${PG_HOST:localhost}
          port: ${PG_PORT:5432}
          database: ${PG_DB:data}
          username: ${PG_USER:postgres}
          password: ${PG_PASSWORD:postgres}
          max-size: 10
        master:
          host: ${PG_HOST:localhost}
          port: ${PG_PORT:5432}
          database: ${PG_DB:data}
          username: ${PG_USER:postgres}
          password: ${PG_PASSWORD:postgres}
          max-size: 10

    mongodb:
      datasources:
        mongo:
          uri: ${MONGO_URI:mongodb://localhost:27017}
          database: ${MONGO_DB:data}
          username: ${MONGO_USER:}
          password: ${MONGO_PASSWORD:}
          auth-database: ${MONGO_AUTH_DB:admin}

    bigquery:
      datasources:
        bq:
          jdbc-url: ${BQ_JDBC_URL:}
          driver-class-name: ${BQ_JDBC_DRIVER:com.simba.googlebigquery.jdbc.Driver}
          project-id: ${BQ_PROJECT:}
          dataset: ${BQ_DATASET:master}
          credentials-file: ${BQ_CREDENTIALS:}
          calcite-schema: bq

    file:
      datasources:
        csv:
          path: ${FILE_PATH:./data/files}
          pattern: ${FILE_PATTERN:party.*[.]csv}
          format: csv
          table: party
          calcite-schema: files
        xlsx:
          path: ${XLSX_PATH:./data/files}
          pattern: ${XLSX_PATTERN:party.*[.]xlsx}
          format: xlsx
          table: party
          sheet: ${XLSX_SHEET:}
          calcite-schema: files

    domains:
      party:
        profiles:
          pg-pg:
            datasources:
              source: landing
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              schema: master
              table: party
              fields: [party_name, country_code, status]

          pg-pg-same-schema:
            datasources:
              source: landing
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              schema: public
              table: party_landing
              fields: [party_name, country_code, status]
            target:
              schema: public
              table: party_master
              fields: [party_name, country_code, status]

          pg-pg-composite:
            datasources:
              source: landing
              target: landing
            migrationKey:
              type: COMPOSITE
              columns: [party_id, country_code]
              separator: "|"
            recon:
              mode: FIELD_DETAILS
              conditionFields: [party_name, status]
            source:
              schema: landing
              table: party
              fields: [party_name, status]
            target:
              schema: master
              table: party
              fields: [party_name, status]

          pg-mongo:
            datasources:
              source: landing
              target: mongo
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              collection: party
              fields: [party_name, country_code, status]
              query: '{}'

          pg-bigquery:
            datasources:
              source: landing
              target: bq
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              table: party
              fields: [party_name, country_code, status]

          mongo-pg:
            datasources:
              source: mongo
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              collection: party
              fields: [party_name, country_code, status]
              query: '{}'
            target:
              schema: master
              table: party
              fields: [party_name, country_code, status]

          bigquery-pg:
            datasources:
              source: bq
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              table: party
              fields: [party_name, country_code, status]
            target:
              schema: master
              table: party
              fields: [party_name, country_code, status]

          mongo-bigquery:
            datasources:
              source: mongo
              target: bq
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              collection: party
              fields: [party_name, country_code, status]
              query: '{}'
            target:
              table: party
              fields: [party_name, country_code, status]

          pg-csv:
            datasources:
              source: landing
              target: csv
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              table: party
              fields: [party_name, country_code, status]

          pg-xlsx:
            datasources:
              source: landing
              target: xlsx
            migrationKey:
              type: SINGLE
              columns: [party_id]
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              table: party
              fields: [party_name, country_code, status]
