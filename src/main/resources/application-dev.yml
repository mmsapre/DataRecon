# Local / developer profile (default).
# App store is PostgreSQL only (results + catalog).
# Named source/target datasources are registered via API, not YAML.
mms:
  recon:
    database:
      host: localhost
      port: 5436
      name: data_recon
      username: postgres
      password: postgres
      manage-schema: true
      # Drop and recreate rec_* tables on every start (catalog/run data wiped).
      recreate-on-start: true
