# party / bigquery-pg
# BigQuery bq.party -> PostgreSQL master.party (Calcite)
mms:
  recon:
    domains:
      party:
        profiles:
          bigquery-pg:
            datasources:
              source: bq
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              table: party
              fields: [party_name, country_code, status]
            target:
              schema: master
              table: party
              fields: [party_name, country_code, status]
