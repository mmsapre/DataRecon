# party / pg-pg
# PostgreSQL landing.party -> PostgreSQL master.party (other schema, same database)
mms:
  recon:
    domains:
      party:
        profiles:
          pg-pg:
            datasources:
              source: landing
              target: landing
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              schema: landing
              table: party
              fields: [party_name, country_code, status]
            target:
              schema: master
              table: party
              fields: [party_name, country_code, status]
