# party / mongo-bigquery
# MongoDB mongo.party -> BigQuery bq.party (Calcite)
mms:
  recon:
    domains:
      party:
        profiles:
          mongo-bigquery:
            datasources:
              source: mongo
              target: bq
            migrationKey:
              type: SINGLE
              columns: [party_id]
            recon:
              mode: MISMATCH_DETAILS
            source:
              collection: party
              fields: [party_name, country_code, status]
              query: '{}'
            target:
              table: party
              fields: [party_name, country_code, status]
