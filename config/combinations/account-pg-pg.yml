# account / pg-pg
# Second domain example. PostgreSQL landing.account -> PostgreSQL master.account
# Counts-only recon (no per-key detail rows)
mms:
  recon:
    domains:
      account:
        profiles:
          pg-pg:
            datasources:
              source: landing
              target: landing
            migrationKey:
              type: SINGLE
              columns: [account_id]
            recon:
              mode: COUNTS
            source:
              schema: landing
              table: account
              fields: [account_name, status]
            target:
              schema: master
              table: account
              fields: [account_name, status]
