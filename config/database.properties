# PostgreSQL result store owned by Data Recon (not source/target).
# Create an empty database (default name data_recon). On startup Flyway creates
# schema + rec_run + rec_record using these names. See README.md#setup.
mms.recon.database.host=${DATA_RECON_DB_HOST:localhost}
mms.recon.database.port=${DATA_RECON_DB_PORT:5432}
mms.recon.database.name=${DATA_RECON_DB_NAME:data_recon}
mms.recon.database.username=${DATA_RECON_DB_USER:postgres}
mms.recon.database.password=${DATA_RECON_DB_PASSWORD:postgres}
mms.recon.database.maximum-pool-size=5
mms.recon.database.schema=${DATA_RECON_DB_SCHEMA:public}
mms.recon.database.tables.run=${DATA_RECON_DB_RUN_TABLE:rec_run}
mms.recon.database.tables.record=${DATA_RECON_DB_RECORD_TABLE:rec_record}
